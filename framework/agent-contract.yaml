framework:
  name: Claude Code Operating Framework Example
  version: 0.2.0
  purpose: Demonstrate a sanitized Claude Code-first operating contract for agentic work.
  disclosure_boundary: Composition visible, production machinery withheld.

roles:
  intake:
    owns:
      - brief
      - constraints
      - unknowns
      - initial_risk
    tools:
      - read_context
      - ask_clarifying_questions
  planning:
    owns:
      - plan
      - artifact_list
      - checkpoint_list
    tools:
      - read_context
      - inspect_repository
  data:
    owns:
      - data_summary
      - evidence_notes
      - missing_fields
    tools:
      - read_synthetic_samples
      - run_public_sql
      - inspect_notebook_artifact
      - query_toy_mcp
  decision:
    owns:
      - risk_brief
      - proposed_next_actions
      - residual_risk
    tools:
      - read_analysis_artifacts
      - read_policy_excerpts
  critic:
    owns:
      - critique
      - missing_tests
      - weak_assumptions
    tools:
      - read_artifacts
      - run_checks
  safety:
    owns:
      - approval_requirements
      - policy_findings
      - blocked_actions
    tools:
      - read_policy
      - inspect_hook_logs

approval_gates:
  external_contact:
    required: true
    examples:
      - sending customer updates
      - publishing public status
      - messaging an operator outside the approved workspace
  production_change:
    required: true
    examples:
      - deploying code
      - changing access control
      - modifying production data
      - updating operational status
  financial_action:
    required: true
    examples:
      - buying services
      - changing subscriptions
      - authorizing spend
  restricted_data:
    required: true
    examples:
      - secrets
      - regulated data
      - customer records
      - confidential operations data
  autonomous_action:
    required: true
    examples:
      - acting without human approval
      - scheduling unattended production updates

artifacts:
  required:
    - brief
    - constraints
    - plan
    - data_summary
    - risk_brief
    - critique
    - approval_record
    - evaluation
